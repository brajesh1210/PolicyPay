services:
  postgres:
    image: postgres:15
    container_name: policypay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: policypay
      POSTGRES_PASSWORD: policypay
      POSTGRES_DB: policypay
    ports:
      - "5432:5432"
    volumes:
      - policypay_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: policypay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  policypay_pgdata: